name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: End-to-end tests (Demo mode, no Presage key)
        run: npm run test:e2e
        env:
          CI: '1'
